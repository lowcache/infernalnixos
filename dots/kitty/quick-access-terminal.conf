# Quake drop-down terminal — kitty `quick-access-terminal` kitten.
# Live via the ~/.config/kitty -> dots/kitty out-of-store symlink.
#
# ARCHITECTURE (niri port): the niri compositor only ever *spawns a process*
# (dots/niri/scripts/quake.sh, which runs `kitten quick-access-terminal`). ALL
# window logic — show/hide, edge/position, height, aspect — is done here by kitty
# over the wlr-layer-shell protocol + kitty remote control. niri never manages
# this window (no workspaces, no window-rules, no move-to-workspace). That is what
# makes it perform like the Hyprland quake terminal.
#
# NOTE: kitty config has NO inline comments — the rest of a line after an option
# is its value. Keep comments on their own lines.
#
# Defaults below = "normal height, landscape (full width), top edge" — the state
# a fresh panel opens in. Live toggles (position/height/aspect) are applied by
# quake.sh via `kitten @ resize-os-window --action=os-panel --incremental ...`.

# --- geometry (opening state) ---
# edge: top | bottom | left | right | center | center-sized | none
edge top
# lines: height in text rows (suffix px for pixels)
lines 25
# columns: width in columns (suffix px for pixels); 200 ~= full-width landscape
columns 200

# --- appearance / behaviour ---
background_opacity 0.9
# Hyprland-style: stay open until toggled, do not auto-hide on focus loss
hide_on_focus_loss no
# on-demand: the panel takes keyboard focus when shown/clicked so you can type,
# but niri keeps processing its own keybinds and other surfaces stay reachable.
# (`exclusive` grabs the layer-shell keyboard outright -> niri binds dead and no
# other window is typeable while quake is open.)
focus_policy on-demand
# wlr layer-shell namespace (for debugging / matching)
app_id quake

# --- remote control: lets quake.sh move/resize/toggle the LIVE panel ---
# Without this, re-showing would reset geometry to the defaults above; remote
# control preserves whatever position/height/aspect you last set.
# kitty appends "-<pid>" to this socket name; quake.sh globs kitty-quake-*.
# /run/user/1001 = lowcache (uid 1001) XDG_RUNTIME_DIR on this single-user host.
kitty_override allow_remote_control=yes
kitty_override listen_on=unix:/run/user/1001/kitty-quake
