"$schema" = 'https://starship.rs/config-schema.json'
palette = "m3"
right_format = """
[](tertiary)\
$cmd_duration\
[](fg:tertiary)"""

format = """
[](primary)\
$time\
[](fg:primary bg:neutral_3)\
$memory_usage\
[](fg:neutral_3 bg:neutral_5)\
$git_branch\
$git_status\
[](fg:neutral_5 bg:neutral_7)\
$python\
$golang\
$nodejs\
$docker_context\
[ ](fg:neutral_7)\
$line_break
$directory\
$character"""


[directory]
style = "fg:on_surface"
format = "  $path "
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:neutral_5"
format = '[[ $symbol $branch ](fg:on_surface bg:neutral_5)]($style)'

[git_status]
style = "bg:neutral_5"
format = '[[($all_status$ahead_behind )](fg:on_surface bg:neutral_5)]($style)'

[nodejs]
symbol = ""
style = "bg:neutral_7"
format = '[[ $symbol( $version) ](fg:on_surface bg:neutral_7)]($style)'

[golang]
symbol = ""
style = "bg:neutral_7"
format = '[[ $symbol( $version) ](fg:on_surface bg:neutral_7)]($style)'

[python]
symbol = ""
style = "bg:neutral_7"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:on_surface bg:neutral_7)]($style)'

[docker_context]
symbol = ""
style = "bg:neutral_7"
format = '[[ $symbol( $context) ](fg:on_surface bg:neutral_7)]($style)'

[memory_usage]
symbol = "󰘚"
threshold = -1
style = "bg:neutral_3 fg:on_surface"
format = "[ ($symbol:$ram_pct) ]($style)"
disabled = false

[time]
disabled = false
time_format = "%I:%M%p"
style = "bg:primary"
format = '[[  $time ](fg:on_primary bg:primary)]($style)'

[line_break]
disabled = true

[character]
disabled = false
success_symbol = '[❯](bold fg:tertiary)'
error_symbol = '[❯](bold fg:error)'
vimcmd_symbol = '[❮](bold fg:tertiary)'
vimcmd_replace_one_symbol = '[❮](bold fg:primary)'
vimcmd_replace_symbol = '[❮](bold fg:primary)'
vimcmd_visual_symbol = '[❮](bold fg:on_surface)'

[cmd_duration]
show_milliseconds = true
format = "[ in $duration]($style)"
style = "bg:tertiary fg:on_tertiary"
disabled = false
show_notifications = true
min_time_to_notify = 45000

