# Vol NixOS — Noctalia v5 config-dir base (~/.config/noctalia/config.toml, live via
# out-of-store symlink). The shell merges every *.toml here with runtime overrides in
# the state dir (~/.local/state/noctalia/settings.toml). Schema: https://docs.noctalia.dev/v5
# Validate after editing: `noctalia config validate`. Build the bar/widget layout with the
# in-shell widgets_editor, then capture it here once validate confirms the schema.

[shell]
font_family = "JetBrainsMono Nerd Font"
settings_show_advanced = true

# Noctalia owns colour selection. Scheme source/palette are picked in the shell UI
# and live in the state dir (~/.local/state/noctalia/settings.toml) — deliberately NOT
# pinned here, so this file does not fight the runtime override.
[theme]
mode = "dark"
