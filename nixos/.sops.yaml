keys:
  - &user age1fdm66yk5su3yrndfqcm65rs8kdpqk8zxgjwxhxglgu979epd0vrs8whemn
  - &host age1eweg3j5nlwyt7n2n6s5tqfv7tpr2afxl3jk8u307xvwgq904sgfqc763mk
creation_rules:
  # Host-scoped secrets: admin user + host can decrypt
  - path_regex: host-secrets\.yaml$
    key_groups:
      - age:
        - *user
        - *host
  # VM-scoped secrets: host key only (net-gate shares the host SSH key via
  # virtio-fs, so anything here is readable by the VM — and nothing else is)
  - path_regex: vm-secrets\.yaml$
    key_groups:
      - age:
        - *host
  # Legacy rule kept for transition; ordered LAST because the regex is
  # unanchored and would otherwise shadow the two rules above.
  # Remove once secrets.yaml is renamed to host-secrets.yaml (P4-T2).
  - path_regex: secrets\.yaml$
    key_groups:
      - age:
        - *user
        - *host
