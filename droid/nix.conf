# Bootstrap-only Nix settings for Nix-on-Droid. Install BEFORE the first switch:
#
#   mkdir -p ~/.config/nix
#   curl -sfL https://raw.githubusercontent.com/lowcache/volnixos/main/droid/nix.conf \
#     -o ~/.config/nix/nix.conf
#
# Why this file exists (the bootstrap paradox):
#
# droid/default.nix declares cache.numtide.com as a substituter, but
# `nix.substituters` is only written to /etc/nix/nix.conf DURING activation —
# and the first switch must build the generation before it can activate it. So
# on a fresh device the setting that would prevent compiling the llm-agents set
# from source has not been applied yet.
#
# Passing --option extra-trusted-public-keys on the command line works in
# principle, but the key is 44 characters of base64 and the first switch is
# typically typed on a phone keyboard. One wrong character and nix silently
# falls back to building from source: it reports
# "ignoring substitute for /nix/store/... because it's not signed by any of the
# keys", then tries to build python3.14-sqlalchemy-bigquery, whose tarball
# cannot be unpacked under proot ("tar: Cannot change mode ..."), and the whole
# switch fails several minutes in.
#
# ~/.config/nix/nix.conf is NOT managed by nix-on-droid, so it survives every
# activation and keeps applying to plain `nix` invocations too. `extra-`
# prefixed settings append to the values nix-on-droid sets rather than
# replacing them.
#
# Key read from numtide/llm-agents.nix's own `nixConfig`; verified against the
# Sig field of a published narinfo.

extra-substituters = https://cache.numtide.com
extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
