# Builds the volnix system closure (and MicroVM runners) on every push to
# main, pushing all newly built store paths to cachix:volnixos.
#
# Bootstrap order matters: this must push at least once before hosts can
# pull. Trust is wired on the host side in nixos/modules/nix-settings.nix
# (substituters + trustedPublicKeys).
#
# Required secret: CACHIX_AUTH_TOKEN (account-scoped bearer token from
# app.cachix.org). Public key lives in plain sight in nix-settings.nix.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch; saves minutes and disk churn.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Standard runners ship ~25 GB of preinstalled toolchains we don't need;
      # the volnix closure (kernel + desktop + noctalia source build) won't
      # fit in the remaining free space otherwise.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /imagegeneration || true
          df -h /

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v16
        with:
          name: volnixos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      # -L: full logs. Toplevel first so a host-breaking change fails fast
      # before spending time on VM runners.
      - name: Build volnix toplevel
        run: nix build -L .#nixosConfigurations.volnix.config.system.build.toplevel

      - name: Build MicroVM runners
        run: |
          nix build -L \
            .#packages.x86_64-linux.net-gate \
            .#packages.x86_64-linux.tailscale-vm

      # Same gate as `make check` (formatting + statix + deadnix).
      - name: Checks (fmt + lint)
        run: |
          nix build -L \
            .#checks.x86_64-linux.formatting \
            .#checks.x86_64-linux.lint
